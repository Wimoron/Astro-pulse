name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Set API_BASE (Settings > Secrets and variables > Actions > Variables) to your deployed site, e.g. https://astropulse.vercel.app
      # for live NASA data. Without it the app still works, using its built-in sample of 87 stars.
      - run: npm run android:sync
        env:
          NEXT_PUBLIC_API_BASE: ${{ vars.API_BASE }}
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: AstroPulse-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
